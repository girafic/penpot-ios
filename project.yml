name: PenpotiOS
options:
  # Not app.penpot.*: that is Penpot's domain, and this is an unofficial app.
  bundleIdPrefix: io.github.girafic
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

# DEVELOPMENT_TEAM comes from the git-ignored Support/Signing.local.xcconfig (see
# Support/Signing.xcconfig) — never set it here, a project setting would override it.
configFiles:
  Debug: Support/Signing.xcconfig
  Release: Support/Signing.xcconfig

settings:
  base:
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "5"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO

targets:
  PenpotiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.girafic.viewerforpenpot
        INFOPLIST_FILE: Support/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # iPhone only: an iPad build would need its own layout pass and iPad screenshots.
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
    info:
      path: Support/Info.plist
      properties:
        # The App Store name is "Viewer for Penpot"; Penpot's name and logo are Kaleidos'
        # trademarks, so the app neither calls itself Penpot nor uses Penpot's mark.
        CFBundleDisplayName: Viewer
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Languages the app can present in. The per-app language picker in iOS Settings
        # appears once there are 2+ here. Keep in sync with Localizable.xcstrings.
        CFBundleLocalizations:
          - en
          - es
          - de
          - fr
          - pt-BR
          - ru
          - ca
          - nl
          - eu
          - fr-CA
          - gl
          - ha
          - hr
          - it
          - nb
          - pl
          - pt-PT
          - id
          - ro
          - tr
          - el
          - uk
          - cs
          - lv
          - sr
          - fo
          - ko
          - he
          - hi
          - ar
          - fa
          - ja
          - zh-Hans
          - zh-Hant
        # Static launch screen: the app's own mark (never Penpot's) centered on the system
        # background (both assets carry light/dark variants, so it adapts).
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        # Work Sans (Penpot's UI typeface), bundled from Sources/Resources/Fonts.
        UIAppFonts:
          - WorkSans-Regular.ttf
          - WorkSans-Medium.ttf
          - WorkSans-SemiBold.ttf
          - WorkSans-Bold.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Allow http: self-hosted Penpot instances often run on a LAN or behind no TLS, and the
        # server URL is the user's choice. Say so in the App Review notes.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Only HTTPS/TLS through Apple's APIs, which is exempt from export documentation;
        # without this key App Store Connect asks on every upload.
        ITSAppUsesNonExemptEncryption: false
        # An exported PNG/JPEG goes to the share sheet, whose "Save Image" writes to Photos:
        # without this key iOS terminates the app there. Translated in InfoPlist.xcstrings.
        NSPhotoLibraryAddUsageDescription: Saves the boards you export as images to your photo library.

  PenpotiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: PenpotiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.girafic.viewerforpenpot.tests
        GENERATE_INFOPLIST_FILE: YES
