name: PenpotiOS
options:
  bundleIdPrefix: app.penpot.ios
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO

targets:
  PenpotiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.penpot.ios
        INFOPLIST_FILE: Support/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Penpot
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Languages the app can present in. The per-app language picker in iOS Settings
        # appears once there are 2+ here. Keep in sync with Localizable.xcstrings.
        CFBundleLocalizations:
          - en
          - es
          - de
          - fr
          - pt-BR
          - ru
        # Static launch screen: the Penpot mark centered on the system background
        # (both assets carry light/dark variants, so it adapts).
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        # Work Sans (Penpot's UI typeface), bundled from Sources/Resources/Fonts.
        UIAppFonts:
          - WorkSans-Regular.ttf
          - WorkSans-Medium.ttf
          - WorkSans-SemiBold.ttf
          - WorkSans-Bold.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Allow http for self-hosted Penpot instances (MVP convenience).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

  PenpotiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: PenpotiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.penpot.ios.tests
        GENERATE_INFOPLIST_FILE: YES
